previews:
  generation: off

envVarGroups:
  - name: tranche-sandbox-settings
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANCHE_DEPLOYMENT
        value: "1"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: HOLD_MECHANISM
        value: authorization
      - key: SUBCONTRACTOR_SPLIT
        value: agency_pays
      - key: TRANCHE_LLM
        value: "off"

databases:
  - name: tranche-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "18"
    databaseName: tranche
    user: tranche
    ipAllowList: []

services:
  - type: web
    name: tranche-web
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tranche/agents-service deploy:check web && pnpm --filter @tranche/web build
    preDeployCommand: pnpm --filter @tranche/db db:migrate
    startCommand: pnpm --filter @tranche/web start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: tranche-sandbox-settings
      - key: DATABASE_URL
        fromDatabase:
          name: tranche-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: tranche-agents
          property: slug

  - type: workflow
    name: tranche-agents
    runtime: node
    region: oregon
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tranche/agents-service build && pnpm --filter @tranche/agents-service exec playwright install --with-deps chromium
    startCommand: node apps/agents/dist/index.mjs
    envVars:
      - fromGroup: tranche-sandbox-settings
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/ms-playwright
      - key: DATABASE_URL
        fromDatabase:
          name: tranche-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  - type: cron
    name: tranche-tick
    runtime: node
    region: oregon
    schedule: "* * * * *"
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tranche/agents-service build
    startCommand: node apps/agents/dist/cron-tick.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANCHE_CRON_MODE
        value: health
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: tranche-agents
          property: slug

  - type: cron
    name: tranche-reconcile
    runtime: node
    region: oregon
    schedule: "0 * * * *"
    autoDeployTrigger: off
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @tranche/agents-service build
    startCommand: node apps/agents/dist/cron-reconcile.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRANCHE_CRON_MODE
        value: health
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: tranche-agents
          property: slug
