  - '@ai-sdk/google@4.0.92'
  - '@ai-sdk/openai@4.0.89'
  - '@ai-sdk/provider-utils@5.0.57'
  - '@ai-sdk/provider@4.0.25'
  - ai@7.0.134
  - drizzle-orm@0.45.4
